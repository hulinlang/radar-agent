# =============================================================================
# 参数池（param pool）—— 训练 / 评测的**参数硬隔离**
# =============================================================================
# 为什么要有这个文件：
#   用户允许"训练与评测可以是同一个公式的不同参数"，但**不是**同一组参数进两个集。
#   若训练集用了 B=150 MHz、评测集也用 B=150 MHz：
#     · S5 去污染（n-gram + sha256）会报重叠；
#     · 即便绕过检测，评测也失去意义（等于考原题）。
#   → 把每个公式的参数组**预先劈成 train / eval 两半**，出题时只能从对应半边取。
#
# ⚠️ 铁律：
#   1. train 与 eval 的参数组**不得重叠**（数值相同即视为重叠）；
#   2. 出题时**只能**引用本文件里的参数组，不得临场自造；
#   3. 若某公式的 pool 用尽，应在此文件**追加**（保持单一来源），不要在 yaml 里硬写。
#
# ⚠️ 参数取值原则：
#   · 取**真实雷达的量级**（X 波段 10 GHz、车载 77 GHz、PRF 数百 Hz–数十 kHz…），
#     不用"整整齐齐"的 1/2/5 序列 —— 否则模型会学成"看到整数字就套"的量级捷径；
#   · 同一公式内参数跨度要跨 2–3 个数量级（防量级捷径）。
#
# 用法（出题时）：
#   formula: range_resolution
#   inputs: {B: 1.5e8}      # ← 必须来自本文件 range_resolution.train 的某一组
# =============================================================================

pools:

  # ---------------- 波长 / 频率 ----------------
  wavelength:
    # 真实频段：S 3G / C 5G / X 10G / Ku 15G / K 24G / Ka 35G / W 94G / 车载 77G
    train: [{f0: 3.0e9}, {f0: 1.0e10}, {f0: 1.5e10}, {f0: 2.4e10}, {f0: 3.5e10}, {f0: 7.7e10}, {f0: 9.4e10}, {f0: 5.6e9}, {f0: 9.4e9}]
    eval:  [{f0: 5.0e9}, {f0: 1.6e10}, {f0: 2.2e10}, {f0: 7.9e10}]

  # ---------------- 分辨率 ----------------
  range_resolution:
    train: [{B: 1.5e8}, {B: 4.0e9}, {B: 5.0e8}, {B: 2.0e7}, {B: 1.0e9}, {B: 3.0e8}, {B: 8.0e8}, {B: 6.0e7}, {B: 1.0e7}, {B: 4.0e6}, {B: 7.0e7}, {B: 1.2e9}, {B: 2.5e8}, {B: 3.5e7}, {B: 9.0e6}, {B: 5.5e8}]
    eval:  [{B: 1.0e8}, {B: 2.5e9}, {B: 8.0e7}, {B: 5.0e6}]

  range_resolution_tau:
    train: [{tau: 1.0e-6}, {tau: 1.0e-7}, {tau: 1.0e-5}, {tau: 2.0e-6}, {tau: 5.0e-7}, {tau: 5.0e-6}, {tau: 2.0e-5}, {tau: 2.0e-7}]
    eval:  [{tau: 3.0e-7}, {tau: 3.0e-6}, {tau: 1.5e-5}, {tau: 5.0e-8}]

  doppler_resolution:
    train: [{t_cpi: 2.0e-3}, {t_cpi: 2.0e-2}, {t_cpi: 1.0e-2}, {t_cpi: 5.0e-2}, {t_cpi: 1.0e-3}, {t_cpi: 5.0e-3}, {t_cpi: 1.0e-1}, {t_cpi: 5.0e-4}, {t_cpi: 8.0e-3}, {t_cpi: 3.0e-2}, {t_cpi: 1.5e-3}, {t_cpi: 7.0e-2}, {t_cpi: 3.0e-4}, {t_cpi: 2.0e-1}]
    eval:  [{t_cpi: 4.0e-3}, {t_cpi: 2.5e-2}, {t_cpi: 1.5e-2}, {t_cpi: 2.5e-3}]

  velocity_resolution:
    train: [{lam: 0.03, t: 0.02}, {lam: 0.03, t: 0.002}, {lam: 0.008, t: 0.01}, {lam: 0.1, t: 0.05}, {lam: 0.05, t: 0.001}, {lam: 0.02, t: 0.005}, {lam: 0.0039, t: 0.01}, {lam: 0.1, t: 0.1}]
    eval:  [{lam: 0.03, t: 0.005}, {lam: 0.05, t: 0.02}, {lam: 0.008, t: 0.05}, {lam: 0.02, t: 0.001}]

  bandwidth_from_pulse_width:
    train: [{tau: 1.0e-6}, {tau: 1.0e-7}, {tau: 5.0e-6}, {tau: 2.0e-7}, {tau: 1.0e-5}, {tau: 3.0e-7}, {tau: 5.0e-8}, {tau: 2.5e-6}]
    eval:  [{tau: 1.5e-6}, {tau: 8.0e-8}, {tau: 4.0e-6}, {tau: 1.0e-8}]

  sar_azimuth_resolution:
    train: [{D: 2.0}, {D: 0.5}, {D: 5.0}, {D: 1.0}, {D: 10.0}, {D: 0.3}, {D: 3.0}, {D: 0.8}]
    eval:  [{D: 1.5}, {D: 4.0}, {D: 0.6}, {D: 8.0}]

  # ---------------- 模糊 / 不模糊 ----------------
  unambiguous_range:
    train: [{prf: 1.0e4}, {prf: 1.0e3}, {prf: 5.0e3}, {prf: 2.0e4}, {prf: 2.0e3}, {prf: 5.0e4}, {prf: 3.0e2}, {prf: 1.0e5}, {prf: 6.0e3}, {prf: 4.0e3}, {prf: 1.2e4}, {prf: 3.0e4}, {prf: 7.0e2}, {prf: 2.5e5}]
    eval:  [{prf: 3.0e3}, {prf: 8.0e3}, {prf: 1.5e4}, {prf: 5.0e2}]

  unambiguous_velocity:
    train: [{lam: 0.03, prf: 1.0e4}, {lam: 0.03, prf: 2.0e3}, {lam: 0.1, prf: 1.0e3}, {lam: 0.05, prf: 5.0e3}, {lam: 0.02, prf: 2.0e4}, {lam: 0.008, prf: 8.0e3}, {lam: 0.1, prf: 3.0e2}, {lam: 0.03, prf: 5.0e4}, {lam: 0.05, prf: 2.5e4}, {lam: 0.008, prf: 3.0e3}, {lam: 0.02, prf: 6.0e3}, {lam: 0.1, prf: 1.5e3}]
    eval:  [{lam: 0.03, prf: 3.0e3}, {lam: 0.05, prf: 1.0e3}, {lam: 0.02, prf: 1.0e4}, {lam: 0.1, prf: 5.0e2}]

  prf_from_period:
    train: [{t_r: 1.0e-4}, {t_r: 1.0e-3}, {t_r: 2.0e-4}, {t_r: 5.0e-5}, {t_r: 5.0e-4}, {t_r: 2.0e-5}, {t_r: 3.3e-3}, {t_r: 1.0e-5}]
    eval:  [{t_r: 3.3e-4}, {t_r: 8.0e-5}, {t_r: 1.25e-4}, {t_r: 2.5e-3}]

  # ---------------- 多普勒 ----------------
  doppler_frequency:
    train: [{v: 100.0, lam: 0.03}, {v: 30.0, lam: 0.0039}, {v: 250.0, lam: 0.03}, {v: 10.0, lam: 0.008}, {v: 50.0, lam: 0.1}, {v: 300.0, lam: 0.05}, {v: 5.0, lam: 0.0039}, {v: 150.0, lam: 0.02}, {v: 150.0, lam: 0.1}, {v: 60.0, lam: 0.008}, {v: 180.0, lam: 0.0039}, {v: 25.0, lam: 0.05}, {v: 400.0, lam: 0.02}, {v: 15.0, lam: 0.1}, {v: 220.0, lam: 0.0039}]
    eval:  [{v: 200.0, lam: 0.03}, {v: 20.0, lam: 0.008}, {v: 80.0, lam: 0.1}, {v: 120.0, lam: 0.05}]

  velocity_from_doppler:
    train: [{lam: 0.03, f_d: 1.0e3}, {lam: 0.0039, f_d: 1.5e4}, {lam: 0.03, f_d: 5.0e3}, {lam: 0.1, f_d: 2.0e2}, {lam: 0.008, f_d: 8.0e3}, {lam: 0.05, f_d: 1.0e3}, {lam: 0.0039, f_d: 2.0e3}, {lam: 0.02, f_d: 1.0e4}]
    eval:  [{lam: 0.03, f_d: 2.0e3}, {lam: 0.008, f_d: 5.0e3}, {lam: 0.1, f_d: 5.0e2}, {lam: 0.0039, f_d: 1.0e4}]

  range_from_delay:
    train: [{tau: 1.0e-6}, {tau: 1.0e-5}, {tau: 6.7e-6}, {tau: 1.0e-4}, {tau: 2.0e-5}, {tau: 5.0e-7}, {tau: 3.3e-5}, {tau: 2.0e-6}, {tau: 2.5e-5}, {tau: 7.0e-6}, {tau: 1.2e-4}, {tau: 9.0e-7}]
    eval:  [{tau: 4.0e-6}, {tau: 8.0e-5}, {tau: 1.5e-5}, {tau: 3.0e-7}]

  # ---------------- 脉冲压缩 / 匹配滤波 ----------------
  pulse_compression_gain:
    train: [{B: 5.0e6, T: 1.0e-5}, {B: 1.0e8, T: 2.0e-5}, {B: 1.0e6, T: 1.0e-4}, {B: 1.0e7, T: 5.0e-6}, {B: 5.0e7, T: 1.0e-5}, {B: 2.0e8, T: 5.0e-5}, {B: 2.0e6, T: 2.0e-5}, {B: 2.0e7, T: 1.0e-6}]
    eval:  [{B: 8.0e6, T: 1.5e-5}, {B: 1.5e8, T: 3.0e-5}, {B: 5.0e5, T: 5.0e-5}, {B: 3.0e7, T: 2.0e-6}]

  pulse_compression_gain_db:
    train: [{B: 1.0e8, T: 2.0e-5}, {B: 5.0e6, T: 1.0e-5}, {B: 1.0e9, T: 1.0e-4}, {B: 2.0e7, T: 1.0e-6}, {B: 5.0e7, T: 5.0e-6}, {B: 1.0e6, T: 1.0e-3}, {B: 3.0e8, T: 3.0e-5}, {B: 1.5e7, T: 4.0e-6}, {B: 8.0e7, T: 2.5e-5}, {B: 3.0e6, T: 1.5e-5}, {B: 6.0e8, T: 2.0e-5}, {B: 2.5e6, T: 8.0e-6}]
    eval:  [{B: 6.0e7, T: 8.0e-6}, {B: 2.5e8, T: 2.0e-5}, {B: 8.0e5, T: 5.0e-4}, {B: 4.0e7, T: 2.5e-6}]

  coherent_integration_gain_db:
    train: [{n: 8}, {n: 16}, {n: 32}, {n: 64}, {n: 128}, {n: 256}, {n: 10}, {n: 100}, {n: 24}, {n: 40}, {n: 12}, {n: 150}, {n: 512}, {n: 6}]
    eval:  [{n: 4}, {n: 20}, {n: 50}, {n: 200}]

  snr_max_matched:
    # E: 信号能量(J)；n0: 噪声单边功率谱密度(W/Hz)
    train: [{E: 1.0e-6, n0: 4.0e-21}, {E: 5.0e-7, n0: 1.0e-20}, {E: 1.0e-5, n0: 2.0e-21}, {E: 2.0e-6, n0: 8.0e-21}, {E: 1.0e-8, n0: 4.0e-21}, {E: 5.0e-6, n0: 5.0e-20}, {E: 2.0e-7, n0: 1.0e-21}, {E: 1.0e-4, n0: 1.0e-19}]
    eval:  [{E: 3.0e-6, n0: 4.0e-21}, {E: 8.0e-7, n0: 2.0e-20}, {E: 5.0e-8, n0: 1.0e-20}, {E: 2.0e-5, n0: 5.0e-21}]

  # ---------------- FMCW（毫米波语料专属） ----------------
  range_from_beat:
    train: [{f_beat: 1.0e6, t_c: 5.0e-5, B: 3.0e9}, {f_beat: 2.0e6, t_c: 1.0e-4, B: 4.0e9}, {f_beat: 5.0e5, t_c: 2.0e-5, B: 1.0e9}, {f_beat: 1.5e6, t_c: 6.0e-5, B: 2.0e9}, {f_beat: 8.0e5, t_c: 4.0e-5, B: 5.0e8}, {f_beat: 3.0e6, t_c: 8.0e-5, B: 6.0e9}, {f_beat: 1.0e5, t_c: 1.0e-5, B: 5.0e8}, {f_beat: 2.5e6, t_c: 1.2e-4, B: 3.0e9}]
    eval:  [{f_beat: 1.2e6, t_c: 5.5e-5, B: 3.5e9}, {f_beat: 6.0e5, t_c: 3.0e-5, B: 1.5e9}, {f_beat: 4.0e6, t_c: 9.0e-5, B: 7.0e9}, {f_beat: 2.0e5, t_c: 1.5e-5, B: 8.0e8}]

  max_range_fmcw:
    train: [{f_s: 1.6e8, t_c: 5.0e-5, B: 3.0e9}, {f_s: 1.0e7, t_c: 1.0e-4, B: 4.0e9}, {f_s: 5.0e6, t_c: 2.0e-5, B: 1.0e9}, {f_s: 2.0e7, t_c: 6.0e-5, B: 2.0e9}, {f_s: 2.5e7, t_c: 4.0e-5, B: 5.0e8}, {f_s: 1.0e8, t_c: 8.0e-5, B: 6.0e9}, {f_s: 4.0e6, t_c: 1.0e-5, B: 5.0e8}, {f_s: 3.0e7, t_c: 1.2e-4, B: 3.0e9}]
    eval:  [{f_s: 1.2e8, t_c: 5.5e-5, B: 3.5e9}, {f_s: 8.0e6, t_c: 3.0e-5, B: 1.5e9}, {f_s: 5.0e7, t_c: 9.0e-5, B: 7.0e9}, {f_s: 6.0e6, t_c: 1.5e-5, B: 8.0e8}]

  adc_sample_rate:
    # ⚠️ 别用 B=3GHz / R_max=200m / T_c=50μs 这组 —— mmWave 文档"步骤 3"给的答案 16 MHz 是**错的**
    #    （正确值 160 MHz，见 src/dataset/formulas.py 里该公式的注释）。
    train: [{B: 3.0e9, r_max: 150.0, t_c: 5.0e-5}, {B: 4.0e9, r_max: 250.0, t_c: 1.0e-4}, {B: 1.0e9, r_max: 80.0, t_c: 2.0e-5}, {B: 2.0e9, r_max: 120.0, t_c: 6.0e-5}, {B: 5.0e8, r_max: 60.0, t_c: 4.0e-5}, {B: 6.0e9, r_max: 300.0, t_c: 8.0e-5}, {B: 5.0e8, r_max: 30.0, t_c: 1.0e-5}, {B: 3.0e9, r_max: 200.0, t_c: 1.2e-4}, {B: 3.0e9, r_max: 200.0, t_c: 5.0e-5}]
    eval:  [{B: 3.5e9, r_max: 180.0, t_c: 5.5e-5}, {B: 1.5e9, r_max: 100.0, t_c: 3.0e-5}, {B: 7.0e9, r_max: 260.0, t_c: 9.0e-5}, {B: 8.0e8, r_max: 50.0, t_c: 1.5e-5}]

  chirp_slope:
    train: [{B: 4.0e9, t_c: 1.0e-4}, {B: 3.0e9, t_c: 5.0e-5}, {B: 1.0e9, t_c: 2.0e-5}, {B: 2.0e9, t_c: 6.0e-5}, {B: 5.0e8, t_c: 4.0e-5}, {B: 6.0e9, t_c: 8.0e-5}, {B: 5.0e8, t_c: 1.0e-5}, {B: 3.0e9, t_c: 1.2e-4}]
    eval:  [{B: 3.5e9, t_c: 5.5e-5}, {B: 1.5e9, t_c: 3.0e-5}, {B: 7.0e9, t_c: 9.0e-5}, {B: 8.0e8, t_c: 1.5e-5}]

  # ---------------- 雷达方程 ----------------
  noise_power:
    train: [{B: 1.0e6, F: 2.0}, {B: 1.0e7, F: 4.0}, {B: 1.0e8, F: 3.0}, {B: 5.0e6, F: 1.5}, {B: 2.0e7, F: 6.0}, {B: 5.0e5, F: 2.0}, {B: 5.0e7, F: 10.0}, {B: 2.0e6, F: 8.0}]
    eval:  [{B: 3.0e6, F: 3.0}, {B: 8.0e6, F: 5.0}, {B: 3.0e7, F: 2.5}, {B: 2.0e5, F: 4.0}]

  max_detect_range:
    # pt(W) / g(倍) / lam(m) / sigma(m^2) / pn(W) / loss(倍)
    train: [{pt: 1.0e3, g: 1000.0, lam: 0.03, sigma: 5.0, pn: 1.0e-13, loss: 2.0}, {pt: 1.0e4, g: 3000.0, lam: 0.1, sigma: 1.0, pn: 5.0e-14, loss: 3.0}, {pt: 1.0e2, g: 500.0, lam: 0.008, sigma: 10.0, pn: 2.0e-13, loss: 1.5}, {pt: 5.0e3, g: 2000.0, lam: 0.05, sigma: 2.0, pn: 1.0e-14, loss: 4.0}, {pt: 2.0e4, g: 5000.0, lam: 0.02, sigma: 0.5, pn: 8.0e-14, loss: 2.5}, {pt: 5.0e2, g: 800.0, lam: 0.0039, sigma: 20.0, pn: 3.0e-13, loss: 2.0}, {pt: 1.0e5, g: 1.0e4, lam: 0.1, sigma: 0.1, pn: 1.0e-15, loss: 5.0}, {pt: 2.0e3, g: 1500.0, lam: 0.03, sigma: 3.0, pn: 2.0e-14, loss: 3.0}]
    eval:  [{pt: 3.0e3, g: 2000.0, lam: 0.03, sigma: 4.0, pn: 1.5e-13, loss: 2.2}, {pt: 8.0e3, g: 4000.0, lam: 0.05, sigma: 1.5, pn: 6.0e-14, loss: 3.5}, {pt: 3.0e2, g: 600.0, lam: 0.008, sigma: 8.0, pn: 2.5e-13, loss: 1.8}, {pt: 5.0e4, g: 8000.0, lam: 0.1, sigma: 0.2, pn: 5.0e-15, loss: 4.5}]

  range_ratio_from_rcs:
    # ⚠️ 教材 p42 写"RCS 减到 1/10 → 距离降为 50%"，与四次方根**不符**（应为 56.2%）。
    #    出题时以本公式为准（σ1=10, σ2=1 → 0.5623），并在 notes 里标出教材的冲突。
    train: [{sigma1: 10.0, sigma2: 1.0}, {sigma1: 1.0, sigma2: 10.0}, {sigma1: 100.0, sigma2: 1.0}, {sigma1: 2.0, sigma2: 1.0}, {sigma1: 1.0, sigma2: 0.1}, {sigma1: 5.0, sigma2: 1.0}, {sigma1: 1.0, sigma2: 100.0}, {sigma1: 0.5, sigma2: 2.0}]
    eval:  [{sigma1: 4.0, sigma2: 1.0}, {sigma1: 1.0, sigma2: 0.01}, {sigma1: 20.0, sigma2: 5.0}, {sigma1: 1.0, sigma2: 50.0}]
