# =============================================================================
# Roofline 性能模型参数（`src/perf_model.py` / `scripts/p11_perf_model.py` 的唯一输入）
#
# 目的：搭起 `docs/16` §2.2 说的「缺的那座桥」——
#   算子层（手写 GEMM，算力受限）与引擎层（LLM decode，带宽受限）的实测点，
#   用同一个模型算出的屋顶线连起来。
#
# ⚠️ 分层铁律（docs/README §五）：硬件 / 模型 / 精度 / 实测点**只在本文件定义**。
#    代码里不得再写第二份默认值（重复 = 迟早不一致 = 静默错误，§4.6）。
#
# ⚠️ 标注规矩（§5.2、§7）：每个数字必须能回答"是实测、规格、还是推算"。
#    `*_nature` 字段就是干这个的；**推算值不得与实测值混在同一列**。
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# 一、硬件
# -----------------------------------------------------------------------------
hardware:
  gpu:
    name: "NVIDIA RTX 4060 Laptop (AD107)"
    sm_count: 24
    fp32_lanes_per_sm: 128
    ops_per_lane_per_clock: 2          # FMA 一次记 2 FLOP
    # ⚠️ 时钟是**推算**：NVIDIA 标称 boost 2370 MHz，本机未实测。
    #    FP32 峰值随它线性变化，改这一个数即可复算全部算力结论。
    clock_ghz: 2.10
    clock_nature: "推算"
    clock_note: "NVIDIA 标称 boost 2370 MHz；本机未实测实时频率，取保守值 2.10 GHz"
    # 显存带宽两条线，**必须分开**：
    bw_spec_gbps: 272.0                # 128-bit @ 17 Gbps
    bw_spec_nature: "规格"
    bw_achievable_gbps: 217.4          # e2e 实测可达成
    bw_achievable_nature: "实测"
    bw_achievable_source: >-
      docs/27 §1：自研 CUDA F16 gemv v2 等效带宽 215 GB/s ≈ 实测天花板 217.4 GB/s
    l2_mb: 32
    vram_mib: 8188
    vram_source: "docs/01（P0 实测 8188 MiB）"

  # CPU 侧**不给带宽**：本机从未实测过 CPU 内存带宽，凭规格填会引入一个
  # 看起来很合理、实则未经证实的数字（§5.2 禁止编造）。因此 CPU 上的实测点
  # 只做「反推带宽」呈现，不参与屋顶线预测。
  cpu:
    name: "本机 CPU（型号未在 P0 固化）"
    bw_achievable_gbps: null
    bw_nature: "未实测"
    note: "CPU 点只报反推带宽，不做预测；补齐需单独做一次受控带宽实测"

# -----------------------------------------------------------------------------
# 二、模型（阶段 B 的唯一目标：Qwen3-VL-2B 的文本解码器）
# -----------------------------------------------------------------------------
model:
  name: "Qwen3-VL-2B 文本解码器"
  n_layers: 28
  d_model: 2048
  d_ff: 6144
  n_heads: 16
  n_kv_heads: 8              # GQA：16 个 Q 头共享 8 组 KV
  head_dim: 128
  vocab: 151936
  tied_embedding: true       # logits = h @ token_embdᵀ，与输入嵌入共享
  # ⚠️ 激活与 KV 的字节宽**不是**权重精度：本引擎两条路径都是 F32。
  #    来源：cpp/src/gpu_model.cu —— 激活是 float*（gemv_f16_v2 的 x 为 float*），
  #          KV 是 cudaMalloc(..., sizeof(float))（第 1004 行）
  activation_dtype_bytes: 4
  kv_dtype_bytes: 4
  dtype_nature: "实测（读源码）"
  source: "docs/20 §1.1（GGUF metadata + config.json 实测）"
  # 校验目标：本模型自己复算出来的参数量必须等于这个数（由架构参数独立算出，
  # 与 docs/20 的 1.72B 互为双信源）
  expected_total_params: 1720451072

# -----------------------------------------------------------------------------
# 三、精度档（字节数以 models/gguf 下**实测文件大小**为准）
# -----------------------------------------------------------------------------
precision:
  f16:
    label: "F16"
    weight_file: "qwen3vl-sft-f16.gguf"
    weight_file_bytes: 3447350240      # 实测
    tensor_bytes: 3440902144           # 由参数量 × 2B 复算（文件 − 6.4 MB 元数据）
    tensor_bytes_nature: "复算"
    note: "norm 层是 F32，占比 <0.1%，本模型忽略"
  q4_k_m:
    label: "Q4_K_M"
    weight_file: "qwen3vl-sft-Q4_K_M.gguf"
    weight_file_bytes: 1107409888      # 实测
    tensor_bytes: 1107409888           # 混合量化类型，无法由参数量直接推算 → 以文件为准
    tensor_bytes_nature: "实测"
    note: "Q4_K×Q6_K×F32 混合；以实测文件大小当字节预算，元数据高估 <0.6%"

# -----------------------------------------------------------------------------
# 四、KV cache
# -----------------------------------------------------------------------------
kv_cache:
  # = 2(K,V) × 28 层 × 8 头 × 128 维 × **4 B（F32）** = 229376 B
  #
  # ⚠️ 2026-10-08 订正：docs/20 §2.3 把这条式子写成「× 2B」，但它自己给出的
  #    224 KB **只有按 4 B 才算得出来**（2×28×8×128×2 = 114688 B = 112 KiB，
  #    正是 docs/16 §2.1 那个错值的来源）。以实现为准 → **F32 正确，错的是式子里的 2B**。
  bytes_per_token: 229376
  dtype_bytes: 4
  bytes_per_token_formula: "2 × 28 × 8 × 128 × 4"
  dtype_source: "cpp/src/gpu_model.cu（KV 以 float 分配）；docs/28 §2.2 亦标注「KV cache 读（F32）」"
  source: "docs/20 §2.3（224 KiB/token，数值正确）+ 本次实现核实"

# -----------------------------------------------------------------------------
# 五、测量协议（⚠️ 上下文长度必须与实测一致，否则 KV 项对不上）
# -----------------------------------------------------------------------------
bench_protocol:
  prompt: "p1 = 「雷达的工作原理是什么？」"
  prompt_tokens: 5
  decode_tokens_b5: 50
  decode_tokens_b6b_b7: 100
  # decode 期间的 KV 长度：从 5 增长到 5+100，取中点
  avg_ctx_tokens_for_decode: 55
  source: "docs/25 §4「统一用 p1 prompt（5 token）+ 50 token decode」；B6b/B7 用 100 token"
  note: >-
    ⚠️ 这是最容易出静默错误的地方：拿 ctx=4096 的 KV 去比一条 55-token 上下文测出来的
    tok/s，会凭空多算 0.9 GB 访存，结论全错。本模型把 ctx 做成显式参数。

# 敏感性检查用的其它 ctx：
#   105 = p1(5) + 100 decode 的上界（协议内）
#   300 = docs/28 §2.2 屋顶线账用的保守值（用于跨文档对账）
ctx_sensitivity: [55, 105, 300]

# -----------------------------------------------------------------------------
# 六、实测点
#   layer:   operator（算子层，算力受限侧）/ engine（引擎层）
#   session: 测量所属批次。⚠️ 跨 session 漂移 17.3% ≫ 组内 0.6–3.6%
#            （docs/03 已知局限 6）→ **只有 session 相同的点才能做紧误差比较**，
#            故用 `paired_with` 显式声明同 session 对打关系。
# -----------------------------------------------------------------------------
measured_points:
  # ── 算子层：算力受限侧 ───────────────────────────────────────────────
  - id: gemm_fp32_1024
    layer: operator
    label: "手写 FP32 GEMM 1024³"
    kind: gemm
    size: 1024
    measured_gflops: 5542.0
    session: "GEMM 项目（2026.08–09）"
    source: "docs/16 §2.1"
    note: "对照：Naive 的 7.2×、cuBLAS 的 96%"

  # ── 引擎层：GPU decode（B5/B6/B7，同一套协议）────────────────────────
  - id: cuda_f16_v1
    layer: engine
    label: "自研 CUDA F16（gemv v1）"
    hardware: gpu
    precision: f16
    measured_tok_s: 40.4
    session: "B6b（2026-10-07）"
    source: "docs/27 §1"
  - id: cuda_f16_v2
    layer: engine
    label: "自研 CUDA F16（gemv v2）"
    hardware: gpu
    precision: f16
    measured_tok_s: 62.5
    session: "B6b（2026-10-07）"
    paired_with: llamacpp_cuda_f16
    source: "docs/27 §1"
  - id: llamacpp_cuda_f16
    layer: engine
    label: "llama.cpp CUDA F16（参照）"
    hardware: gpu
    precision: f16
    measured_tok_s: 60.8
    session: "B6b（2026-10-07）"
    paired_with: cuda_f16_v2
    source: "docs/27 §1"
  - id: q4_on_gpu
    layer: engine
    label: "自研 Q4-on-GPU（fused dequant-dot + CUDA Graphs）"
    hardware: gpu
    precision: q4_k_m
    measured_tok_s: 119.4
    session: "B7（2026-10-07）"
    paired_with: llamacpp_cuda_q4
    source: "docs/28 §6.2"
  - id: llamacpp_cuda_q4
    layer: engine
    label: "llama.cpp CUDA Q4_K_M（参照）"
    hardware: gpu
    precision: q4_k_m
    measured_tok_s: 116.9
    session: "B7（2026-10-07）"
    paired_with: q4_on_gpu
    source: "docs/28 §6.2"

  # ── 引擎层：CPU decode（另一个硬件，只做反推带宽）─────────────────────
  - id: naive_f16_cpu
    layer: engine
    label: "朴素单线程 F16（CPU）"
    hardware: cpu
    precision: f16
    measured_tok_s: 0.35
    session: "B4（2026-10-06）"
    source: "docs/27 §1"
  - id: openblas_f32_cpu
    layer: engine
    label: "OpenBLAS F32（CPU，对照）"
    hardware: cpu
    precision: f16
    measured_tok_s: 1.45
    session: "B5（2026-10-07）"
    source: "docs/27 §1"
    note: "反证：BLAS 撞内存墙 —— F32 访存量翻倍，比朴素 F16 的 3.67 还慢"
  - id: openmp_f16_cpu
    layer: engine
    label: "OpenMP F16（CPU，16 线程）"
    hardware: cpu
    precision: f16
    measured_tok_s: 3.67
    session: "B5（2026-10-07）"
    source: "docs/27 §1"
  - id: avx2_f16_cpu
    layer: engine
    label: "AVX2 F16（CPU）"
    hardware: cpu
    precision: f16
    measured_tok_s: 10.3
    session: "B6a（2026-10-07）"
    source: "docs/27 §1"
  - id: avx2_q4_cpu
    layer: engine
    label: "AVX2 Q4_K_M（CPU）"
    hardware: cpu
    precision: q4_k_m
    measured_tok_s: 17.9
    session: "B6a（2026-10-07）"
    source: "docs/27 §1"
  - id: llamacpp_cpu_q4
    layer: engine
    label: "llama.cpp CPU Q4_K_M（参照）"
    hardware: cpu
    precision: q4_k_m
    measured_tok_s: 37.9
    session: "阶段 A（A3）"
    source: "docs/27 §1"

  # ── P1 的 HF 基线（⚠️ 不同 session、不同协议）────────────────────────
  - id: hf_bf16
    layer: engine
    label: "HF transformers bf16（P1 基线）"
    hardware: gpu
    precision: f16
    measured_tok_s: 24.0
    session: "P1 E1（2026-09-14）"
    source: "docs/16 §2.1"
    cross_session: true
    note: "⚠️ 与 B 组不同 session / 不同协议（max_new_tokens 974 vs 100），只作数量级参考"

# ── prefill（B8a，Q4_K_M，docs/29 §7.2）────────────────────────────────
measured_prefill:
  precision: q4_k_m
  hardware: gpu
  session: "B8a（2026-10-07）"
  source: "docs/29 §7.2 / §4（显存预算表标明 B8 用 Q4_K_M）"
  points:
    - {prompt_tokens: 132,  measured_tok_s: 612.0, baseline_tok_s: 127.0}
    - {prompt_tokens: 572,  measured_tok_s: 616.0, baseline_tok_s: 119.0}
    - {prompt_tokens: 1280, measured_tok_s: 568.0, baseline_tok_s: 106.0}

# -----------------------------------------------------------------------------
# 七、本模型的已知简化（如实列出，避免读者高估其精度）
# -----------------------------------------------------------------------------
model_limitations:
  - "只算 matmul + attention 的 FLOPs，忽略 RMSNorm / RoPE / SiLU / softmax / 采样（合计 <1%）"
  - "激活访存只按『每层 hidden + FFN 中间量各往返一次』估计 —— 真实融合 kernel 会更少"
  - "不含 kernel launch 开销；B7 用 CUDA Graphs 把它压到可忽略，v1/CPU 路径不含此优化"
  - "Q4 的 dequant 指令开销**不在模型内**：模型给的是带宽屋顶，Q4 落在屋顶下方正是该开销的证据"
  - "CPU 侧不给带宽（未实测）→ CPU 点只报反推带宽，不做预测"
  - "时钟 2.10 GHz 是推算 → 算力屋顶的绝对值有不确定性；但 decode 结论（带宽受限）对这个值不敏感"
  - "HF bf16 那一行是跨 session / 跨协议的参照（max_new_tokens 974 vs 100，且 HF 同时驻留视觉塔权重）；
     本模型只按文本解码器算它的每 token 访存 ⇒ 该行利用率只作数量级参考（报告里已标 ⚠️跨session）"
