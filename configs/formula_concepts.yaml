# =============================================================================
# 公式概念表（P4-S1c · 按「名字」索引公式，而不是按字面内容）
#
# ■ 为什么需要它
#   同一概念的公式在不同资料里**写法不同**，实测三层差异：
#     ① 排版：`\frac { c } { 2 B }` vs `\frac{c}{2B}`   → 归一化已能解决
#     ② 结构：教材写 `ΔR = cτ/2`（斜杠），标准写 `ΔR = c/(2B)`（分式）→ **字符串匹配无解**
#     ③ 符号：同一概念有的用 B（带宽）、有的用 τ（脉宽）      → **字符串匹配无解**
#   ② ③ 导致「按公式字面回捞」只能成功 30%（2026-09-20 实测）。
#   → 改为给公式挂一个**概念名**（像图有 `Fig. 1` 一样），按名字检索。
#
# ■ 为什么用「术语锚定」而不是写公式模板
#   术语是自然语言，**不受符号和写法影响** —— 这正是痛点所在。
#   做法：一段文字里同时出现「该概念的术语」和「公式」→ 给这个 chunk 挂上概念名。
#
# ⚠️ 术语必须**完整且具体**：
#    写「分辨率」会把多普勒分辨率、速度分辨率全卷进来；必须写「距离分辨率」。
#    新增条目时若出现"命中过多"，先看术语是不是太短。
#
# ■ 种子来源
#   22 个 `id` 直接取自 P3 出题时 `answer_check.formula` 字段（不是我编的），
#   保证了和计算题的标准答案**同一套命名**，评测时能直接对上。
# =============================================================================

